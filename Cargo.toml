[package]
name = "disklens"
version = "0.1.0"
edition = "2024"
description = "Native Rust desktop file explorer & disk space visualizer with real-time percentage gauges"
authors = ["SpaceCorps <team@spacecorps.org>", "Rory Chatt"]
license = "MIT"
repository = "https://github.com/SpaceCorps/DiskLens"
readme = "README.md"

[[bin]]
name = "disklens"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.36.2", default-features = true }
egui = "0.36.2"
egui_extras = { version = "0.36.2" }
walkdir = "2.5"
rayon = "1.12"
crossbeam-channel = "0.5"
sysinfo = "0.39"
open = "5.4"
trash = "5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6.0"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

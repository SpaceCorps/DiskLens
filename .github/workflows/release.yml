name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: disklens
            archive_format: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            binary_name: disklens
            archive_format: tar.gz
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: disklens
            archive_format: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: disklens.exe
            archive_format: zip

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package artifacts
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" || "$TAG" == "main" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          PKG_NAME="disklens-${TAG}-${{ matrix.target }}"
          mkdir -p "$PKG_NAME"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$PKG_NAME/"
          cp README.md LICENSE "$PKG_NAME/"

          if [ "${{ matrix.archive_format }}" = "zip" ]; then
            7z a "${PKG_NAME}.zip" "$PKG_NAME"
            echo "ARCHIVE=${PKG_NAME}.zip" >> $GITHUB_ENV
          else
            tar -czvf "${PKG_NAME}.tar.gz" "$PKG_NAME"
            echo "ARCHIVE=${PKG_NAME}.tar.gz" >> $GITHUB_ENV
          fi

      - name: Upload artifact to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          if [[ -z "$TAG" || "$TAG" == "main" ]]; then
            TAG="${{ inputs.tag }}"
          fi
          gh release upload "$TAG" "$ARCHIVE" --clobber
